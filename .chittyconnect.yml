# ChittyConnect Configuration for ChittyTrace-CC
service:
  name: ChittyTrace-CC
  display_name: ChittyTrace CC
  type: service
  tier: 4
  organization: CHITTYAPPS
  chitty_id: ${CHITTYTRACE_CC_SERVICE_ID}
  domains:
    production: trace-cc.chitty.cc

onboarding:
  endpoint: https://get.chitty.cc/api/onboard
  provisions: [chitty_id, service_token, certificate, trust_chain]

auth:
  provider: chittyauth
  endpoint: https://auth.chitty.cc
  service_token:
    source: chittyconnect
    key: CHITTYTRACE_CC_SERVICE_TOKEN

secrets:
  provider: chittyconnect
  # Cold source of truth is ChittySecrets (secrets.chitty.cc), fronting Cloudflare
  # Secrets Store. 1Password is retired and non-functional on operator hosts; do not
  # reintroduce op:// references here.
  cold_source: chittysecrets
  runtime_delivery: cloudflare-secrets
  paths:
    production: chittysecrets://ChittyTrace-CC/prod

github:
  repository: CHITTYAPPS/ChittyTrace-CC

monitoring:
  health:
    endpoint: /health
    interval: 60s
